:root{
  --bg:#050000;--panel:#0b0101;--red:#ff2a2a;--bright:#ff5a5a;--pale:#ffb0b0;--dim:#b01e1e;--deep:#3a0505;
  --glow:0 0 6px rgba(255,42,42,.55);--fs:20px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--pale);font-family:"VT323",ui-monospace,"Courier New",monospace;font-size:var(--fs);line-height:1.25;overflow:hidden}
::selection{background:var(--red);color:#000}
a{color:var(--bright)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px dashed var(--bright);outline-offset:2px}

/* CRT layers */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.38) 0 2px,transparent 2px 4px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.8) 100%)}
.beam{position:fixed;left:0;right:0;height:18vh;top:-18vh;pointer-events:none;z-index:49;
  background:linear-gradient(to bottom,transparent,rgba(255,42,42,.06));animation:beam 7s linear infinite}
@keyframes beam{to{transform:translateY(130vh)}}
#app{position:relative;height:100vh;height:100dvh;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr);
  border:2px solid var(--red);box-shadow:inset 0 0 40px rgba(255,0,0,.15);animation:flicker 5s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:1}48%{opacity:.88}49%{opacity:1}82%{opacity:.95}}

/* header */
header{display:flex;align-items:center;gap:14px;padding:6px 14px;background:#140101;border-bottom:2px solid var(--red);font-size:.85em}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;background:var(--dim)}.dots i:first-child{background:var(--red)}
header .ttl{flex:1;min-width:0;text-align:center;color:var(--pale);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .clk{color:var(--red);text-shadow:var(--glow)}

/* main */
main{display:grid;grid-template-columns:minmax(300px,2fr) minmax(0,3fr);min-height:0}
.side{border-right:2px solid var(--deep);display:flex;flex-direction:column;padding:14px;gap:12px;min-height:0;overflow:hidden}
.globe-wrap{position:relative;flex:1;min-height:0;display:grid;place-items:center}
#globe{width:min(100%,62vh);aspect-ratio:1;image-rendering:pixelated;cursor:grab;touch-action:none;filter:drop-shadow(0 0 8px rgba(255,30,30,.45))}
#globe:active{cursor:grabbing}
.hint{position:absolute;bottom:0;left:0;right:0;text-align:center;color:var(--dim);font-size:.8em}
.tele{display:grid;grid-template-columns:auto 1fr;gap:0 14px;font-size:.9em}
.tele dt{color:var(--dim)}.tele dd{color:var(--pale)}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.on{color:var(--red);text-shadow:var(--glow)}
#feed{height:5.2em;overflow:hidden;color:var(--dim);font-size:.8em;border-top:1px dashed var(--deep);padding-top:6px;white-space:nowrap}

.term{display:flex;flex-direction:column;min-height:0;padding:14px 18px 8px}
#out{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--dim) transparent;padding-right:6px;overflow-wrap:anywhere}
#out>*{animation:type .28s steps(24) both}
@keyframes type{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.line{min-height:1.25em}
.echo{color:var(--pale)}.echo .p{color:var(--red)}
.mut{color:var(--dim)}.hi{color:var(--red);text-shadow:var(--glow)}.ok{color:var(--bright)}
.sec{color:var(--red);text-shadow:var(--glow);margin-top:.6em}
.card{border-left:2px solid var(--red);padding:2px 0 2px 12px;margin:.5em 0}
.card h3{font-weight:400;color:var(--bright);font-size:1.05em}
.card .meta{color:var(--dim)}
.card ul{list-style:none;margin:.2em 0}
.card li{padding-left:1.2em;text-indent:-1.2em}.card li::before{content:"> ";color:var(--red)}
.tags{display:flex;flex-wrap:wrap;gap:4px 8px;margin:.2em 0}
.tag{color:var(--pale);border:1px solid var(--deep);padding:0 6px;font-size:.85em}
.cmd{color:var(--red);text-decoration:underline dotted;text-underline-offset:3px}
.cmd:hover,.cmd:focus-visible{color:#000;background:var(--red);text-decoration:none}
.grid2{display:grid;grid-template-columns:max-content 1fr;gap:0 18px}
.banner{width:min(100%,560px);image-rendering:pixelated;display:block;margin:.3em 0;animation:glitch 4s infinite}
@keyframes glitch{0%,93%,100%{transform:none;filter:none}94%{transform:translate(-4px,1px);filter:drop-shadow(5px 0 0 var(--dim))}96%{transform:translate(3px,-1px)}}

/* stack */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:.4em 0 .2em}
.tile{border:1px solid var(--deep);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px 6px;text-align:center;font-size:.85em;line-height:1;transition:border-color .15s}
.tile svg{width:30px;height:30px;fill:var(--red);filter:drop-shadow(0 0 4px rgba(255,42,42,.5));transition:fill .15s,transform .15s}
.tile:hover{border-color:var(--red)}.tile:hover svg{fill:var(--brand);transform:scale(1.12)}

/* prompt */
.prompt{display:flex;align-items:center;gap:.5em;padding-top:6px;border-top:1px dashed var(--deep)}
.prompt .p{color:var(--red);text-shadow:var(--glow);white-space:nowrap}
.in-wrap{position:relative;flex:1;display:flex}
#in{flex:1;width:100%;background:transparent;border:0;outline:0;color:var(--pale);font:inherit;caret-color:var(--red);caret-shape:block}

/* chips */
nav{display:flex;gap:8px;padding:8px 14px;border-top:2px solid var(--red);background:#0d0101;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:1px solid var(--red);color:var(--red);padding:2px 12px;white-space:nowrap}
nav button:hover,nav button:focus-visible{background:var(--red);color:#000}

/* boot */
#boot{position:fixed;inset:0;z-index:40;background:var(--bg);padding:6vh 7vw;color:var(--red);text-shadow:var(--glow);font-size:1.1em;cursor:pointer}
#boot .line{white-space:pre-wrap;animation:type .25s steps(30) both}
#bar{width:min(420px,70vw);height:18px;border:2px solid var(--red);margin:.6em 0;padding:2px}
#bar i{display:block;height:100%;width:0;background:var(--red);transition:width .6s steps(8)}
#granted{font-size:clamp(32px,7vw,72px);letter-spacing:.2em;color:var(--bright);margin-top:.3em;visibility:hidden}
#granted.show{visibility:visible;animation:blink .15s steps(1) 4}
#boot .skip{position:absolute;bottom:4vh;left:7vw;color:var(--dim);font-size:.8em}
#boot.out{animation:bootout .35s steps(4) forwards}
@keyframes bootout{50%{transform:skewX(8deg);opacity:.6}100%{opacity:0;visibility:hidden}}

@media (max-width:860px){
  :root{--fs:18px}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
  .side{border-right:0;border-bottom:2px solid var(--deep);flex-direction:row;align-items:center;padding:8px 12px}
  .globe-wrap{flex:0 0 auto}
  #globe{width:min(34vw,24vh)}
  .hint,#feed{display:none}
  .tele{font-size:.85em}
  .term{padding:10px 12px 6px}
  header .ttl{text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .beam{display:none}
}
</style>
</head>

function lev(a, b) {
  const d = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0]; d[0] = i;
    for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
  }
  return d[b.length];
}
const names = () => [...Object.keys(COMMANDS).filter(k => !COMMANDS[k].hidden), ...ITEMS.map(i => i.id)];

}
async function exec(raw) {

}

    const x = cl * Math.sin(l), y0 = Math.sin(lat), z0 = cl * Math.cos(l);
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    return [x, y0 * cp - z0 * sp, z0 * cp + y0 * sp];
  }
  const put = (x, y, c) => { x = Math.round(x); y = Math.round(y); if (x >= 0 && y >= 0 && x < S && y < S) buf[y * S + x] = c; };

  function draw(t) {
    requestAnimationFrame(draw);
    if (t - last < 33) return;
    last = t; frame++;
    if (!dragging) { vel += (AUTO - vel) * 0.03; yaw += vel; }
    buf.fill(0);
    for (const [la, lo] of pts) { const [x, y, z] = proj(la, lo); if (z < 0 && (frame + Math.round(la * 50)) % 2) put(cx + x * R, cy - y * R, C.back); }
    for (const [la, lo] of grat) { const [x, y, z] = proj(la, lo); if (z > 0) put(cx + x * R, cy - y * R, C.grat); }
    for (const [la, lo] of pts) { const [x, y, z] = proj(la, lo); if (z > 0) put(cx + x * R, cy - y * R, z > 0.62 ? C.l3 : z > 0.3 ? C.l2 : C.l1); }
    for (let a = 0; a < 360; a += 1.2) put(cx + Math.cos(a * D) * (R + 1), cy + Math.sin(a * D) * (R + 1), C.rim);
    const [bx, by, bz] = proj(BER[0], BER[1]);
    if (bz > 0) {
      const sx = cx + bx * R, sy = cy - by * R;
      for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) put(sx + dx, sy + dy, C.mark);
      const pr = 2 + (frame % 24) / 3;
      if (!REDUCED) for (let a = 0; a < 360; a += 20) put(sx + Math.cos(a * D) * pr, sy + Math.sin(a * D) * pr, C.mark);
    }
    if (!REDUCED) sat += 0.03;
    const ox = Math.cos(sat) * 1.32, oz = Math.sin(sat) * 1.32, oy = Math.sin(sat) * 0.42;
    const sx = cx + ox * R, sy = cy - oy * R, hidden = oz < 0 && Math.hypot(ox, oy) < 1;
    trail.push([sx, sy, hidden]); if (trail.length > 14) trail.shift();
    for (const [x, y, hdn] of trail) if (!hdn) put(x, y, C.trail);
    if (!hidden) { put(sx, sy, C.sat); put(sx + 1, sy, C.sat); put(sx, sy + 1, C.sat); put(sx + 1, sy + 1, C.sat); }
    ctx.putImageData(img, 0, 0);
  }
  requestAnimationFrame(draw);

  cv.addEventListener("pointerdown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener("pointermove", e => {
    if (!dragging) return;
    const k = 3.2 / cv.clientWidth;
    const dx = (e.clientX - lastX) * k, dy = (e.clientY - lastY) * k;
    yaw += dx; vel = dx; pitch = Math.max(-1.2, Math.min(1.2, pitch + dy));
    lastX = e.clientX; lastY = e.clientY;
  });
  const up = () => { dragging = false; };
  cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
})();
